<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#683BB4" />
    <meta
      name="description"
      content="BuscaPet: consulte alertas, registre animais e compartilhe avistamentos com segurança."
    />
    <script>
      (() => {
        try {
          const preferences = JSON.parse(localStorage.getItem("bp.ui.preferences") || "{}");
          const theme = preferences.theme || "system";
          const resolved = theme === "system"
            ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : theme;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = theme;
          if (preferences.contrast) document.documentElement.dataset.contrast = "high";
          if (preferences.links) document.documentElement.dataset.links = "highlighted";
          if (preferences.focus) document.documentElement.dataset.focus = "enhanced";
          if (preferences.reduceMotion) document.documentElement.dataset.motion = "reduced";
          if (Number.isFinite(preferences.textScale)) document.documentElement.style.setProperty("--user-text-scale", String(preferences.textScale));
        } catch { document.documentElement.dataset.theme = "light"; }
      })();
    </script>
    <title>BuscaPet | Organize a busca</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <noscript>Ative o JavaScript para usar o BuscaPet.</noscript>
    <main class="app-shell" id="main-content" tabindex="-1"></main>
  </body>
</html>
