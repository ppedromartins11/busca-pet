name: Homologação visual da apresentação

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'style.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/homologacao-apresentacao.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navegador:
    name: Chromium, permissões e layouts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe e testes de regressão
        run: |
          npm run check
          npm test

      - name: Compilar versão de apresentação
        run: npm run build:presentation

      - name: Instalar Chromium de teste
        run: npx playwright install --with-deps chromium

      - name: Verificar rotas, formulários e responsividade
        env:
          BASE_URL: http://127.0.0.1:5186
          PRESENTATION_SCREENSHOT_DIR: artifacts/telas
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 5186 > /tmp/buscapet-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5186/" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:5186/" >/dev/null
          node tests/presentation-homologation.browser.cjs

      - name: Anexar capturas de tela de revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buscapet-telas-chromium
          path: artifacts/telas/
          if-no-files-found: ignore
          retention-days: 7
